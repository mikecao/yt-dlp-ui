[package]
name = "get-down"
version = "0.12.0"
description = "A simple downloadBinaries tool"
authors = ["Mike Cao <mike@mikecao.com>"]
license = "MIT"
repository = "https://github.com/mikecao/get-down"
default-run = "get-down"
edition = "2021"
rust-version = "1.59"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
reqwest = { version = "0.13.1", default-features = false, features = ["rustls", "json", "form", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10.3"
zeroize = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
